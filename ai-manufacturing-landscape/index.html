<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI x Manufacturing Landscape</title>
<style>
:root {
  --ds-font-family: Arial, Helvetica, sans-serif;
  --ds-font-size-xs: 11px;
  --ds-font-size-sm: 13px;
  --ds-font-size-base: 15px;
  --ds-font-size-lg: 18px;
  --ds-font-size-xl: 24px;
  --ds-font-size-2xl: 32px;
  --ds-color-red-100: #FDEAEA;
  --ds-color-red-200: #F5B3B3;
  --ds-color-red-300: #E86666;
  --ds-color-red-400: #CC0000;
  --ds-color-red-500: #990000;
  --ds-color-red-600: #660000;
  --ds-surface: #FFFFFF;
  --ds-surface-raised: #F7F7F7;
  --ds-surface-muted: #EBEBEB;
  --ds-text-primary: #1A1A1A;
  --ds-text-secondary: #555555;
  --ds-text-muted: #888888;
  --ds-border: #CCCCCC;
  --ds-border-light: #E5E5E5;
  --ds-focus-ring: #CC0000;
  --ds-shadow: 0 2px 8px rgba(0,0,0,0.08);
  --ds-radius-sm: 4px;
  --ds-radius-md: 8px;
  --ds-spacing-xs: 4px;
  --ds-spacing-sm: 8px;
  --ds-spacing-md: 16px;
  --ds-spacing-lg: 24px;
  --ds-spacing-xl: 32px;
  --ds-touch-min: 44px;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--ds-font-family);
  font-size: var(--ds-font-size-base);
  color: var(--ds-text-primary);
  background: var(--ds-surface);
  line-height: 1.5;
}

:focus-visible {
  outline: 2px solid var(--ds-focus-ring);
  outline-offset: 2px;
}

button, a, input, select, [tabindex="0"] {
  font-family: var(--ds-font-family);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  border: 0;
}

#app { min-height: 100vh; display: flex; flex-direction: column; }

/* Entry */
.entry-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--ds-spacing-xl);
  background: var(--ds-surface-raised);
}
.entry-screen h1 {
  font-size: var(--ds-font-size-2xl);
  margin: 0 0 var(--ds-spacing-sm);
  text-align: center;
}
.entry-screen .subtitle {
  color: var(--ds-text-secondary);
  margin-bottom: var(--ds-spacing-xl);
  text-align: center;
  max-width: 640px;
}
.doors {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--ds-spacing-lg);
  max-width: 900px;
  width: 100%;
}
.door {
  background: var(--ds-surface);
  border: 1px solid var(--ds-border);
  border-radius: var(--ds-radius-md);
  padding: var(--ds-spacing-lg);
  min-height: 160px;
  cursor: pointer;
  text-align: left;
  box-shadow: var(--ds-shadow);
  transition: border-color 0.15s;
}
.door:hover, .door:focus-visible {
  border-color: var(--ds-color-red-400);
}
.door h2 {
  font-size: var(--ds-font-size-lg);
  margin: 0 0 var(--ds-spacing-sm);
}
.door p {
  color: var(--ds-text-secondary);
  font-size: var(--ds-font-size-sm);
  margin: 0;
}

/* Shell */
.shell { display: flex; flex: 1; min-height: 0; }
.shell.hidden { display: none; }

/* Left rail - stages */
.left-rail {
  width: 120px;
  flex-shrink: 0;
  background: var(--ds-surface-raised);
  border-right: 1px solid var(--ds-border-light);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.left-rail-label {
  font-size: var(--ds-font-size-xs);
  font-weight: bold;
  text-transform: uppercase;
  color: var(--ds-text-muted);
  padding: var(--ds-spacing-sm);
  border-bottom: 1px solid var(--ds-border-light);
}
.stage-btn {
  display: flex;
  align-items: center;
  min-height: var(--ds-touch-min);
  padding: var(--ds-spacing-sm) var(--ds-spacing-md);
  border: none;
  background: transparent;
  cursor: pointer;
  text-align: left;
  font-size: var(--ds-font-size-sm);
  color: var(--ds-text-primary);
  border-left: 3px solid transparent;
  width: 100%;
}
.stage-btn:hover { background: var(--ds-surface-muted); }
.stage-btn.active {
  background: var(--ds-color-red-100);
  border-left-color: var(--ds-color-red-400);
  font-weight: bold;
}

/* Main column */
.main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* Top rail - tech */
.top-rail {
  background: var(--ds-surface-raised);
  border-bottom: 1px solid var(--ds-border-light);
}
.top-rail-row {
  display: flex;
  align-items: stretch;
}
.tech-btn {
  flex: 1;
  min-height: var(--ds-touch-min);
  border: none;
  cursor: pointer;
  font-size: var(--ds-font-size-sm);
  font-weight: bold;
  color: var(--ds-text-primary);
  border-bottom: 3px solid transparent;
  padding: var(--ds-spacing-sm) var(--ds-spacing-md);
}
.tech-btn:hover { filter: brightness(0.97); }
.tech-btn.active { border-bottom-color: var(--ds-color-red-600); }
.tech-predictive { background: var(--ds-color-red-100); }
.tech-generative { background: var(--ds-color-red-200); }
.tech-vision { background: var(--ds-color-red-300); color: var(--ds-surface); }
.tech-physics { background: var(--ds-color-red-500); color: var(--ds-surface); }

.agentic-band {
  padding: var(--ds-spacing-sm) var(--ds-spacing-md);
  font-size: var(--ds-font-size-sm);
  font-style: italic;
  color: var(--ds-text-secondary);
  background: var(--ds-surface);
  border-top: 1px dashed var(--ds-border);
  text-align: center;
}

/* Toolbar */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: var(--ds-spacing-sm);
  padding: var(--ds-spacing-sm) var(--ds-spacing-md);
  background: var(--ds-surface);
  border-bottom: 1px solid var(--ds-border-light);
  align-items: center;
}
.toolbar-group { display: flex; flex-wrap: wrap; gap: var(--ds-spacing-xs); align-items: center; }
.toolbar label { font-size: var(--ds-font-size-xs); color: var(--ds-text-muted); margin-right: var(--ds-spacing-xs); }
.toolbar select, .toolbar input[type="search"] {
  min-height: var(--ds-touch-min);
  padding: var(--ds-spacing-xs) var(--ds-spacing-sm);
  border: 1px solid var(--ds-border);
  border-radius: var(--ds-radius-sm);
  font-size: var(--ds-font-size-sm);
  background: var(--ds-surface);
}
.toolbar input[type="search"] { min-width: 180px; }
.toolbar .chip {
  min-height: var(--ds-touch-min);
  padding: 0 var(--ds-spacing-md);
  border: 1px solid var(--ds-border);
  border-radius: var(--ds-radius-sm);
  background: var(--ds-surface);
  cursor: pointer;
  font-size: var(--ds-font-size-sm);
  display: inline-flex;
  align-items: center;
}
.toolbar .chip.active {
  background: var(--ds-color-red-100);
  border-color: var(--ds-color-red-400);
}
.toolbar .chip:hover { background: var(--ds-surface-muted); }
.toolbar-spacer { flex: 1; }
.shortlist-badge {
  background: var(--ds-color-red-400);
  color: var(--ds-surface);
  border-radius: 10px;
  padding: 0 6px;
  font-size: var(--ds-font-size-xs);
  margin-left: 4px;
}

/* Breadcrumb */
.breadcrumb {
  padding: var(--ds-spacing-sm) var(--ds-spacing-md);
  font-size: var(--ds-font-size-sm);
  color: var(--ds-text-secondary);
  border-bottom: 1px solid var(--ds-border-light);
}
.breadcrumb a {
  color: var(--ds-color-red-400);
  text-decoration: none;
  cursor: pointer;
}
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb span.sep { margin: 0 var(--ds-spacing-xs); color: var(--ds-text-muted); }

/* Content */
.content {
  flex: 1;
  overflow-y: auto;
  padding: var(--ds-spacing-md);
}

/* Stepper */
.stepper {
  display: flex;
  align-items: center;
  gap: var(--ds-spacing-sm);
  margin-bottom: var(--ds-spacing-md);
}
.stepper button {
  min-width: var(--ds-touch-min);
  min-height: var(--ds-touch-min);
  border: 1px solid var(--ds-border);
  background: var(--ds-surface);
  border-radius: var(--ds-radius-sm);
  cursor: pointer;
  font-size: var(--ds-font-size-lg);
}
.stepper button:hover { background: var(--ds-surface-muted); }
.stepper button:disabled { opacity: 0.4; cursor: not-allowed; }
.stepper-label { font-size: var(--ds-font-size-sm); color: var(--ds-text-secondary); }

/* Landscape grid */
.landscape-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--ds-spacing-sm);
  margin-bottom: var(--ds-spacing-lg);
}
.grid-cell {
  border: 1px solid var(--ds-border-light);
  border-radius: var(--ds-radius-md);
  padding: var(--ds-spacing-sm);
  min-height: 100px;
  cursor: pointer;
  position: relative;
  transition: box-shadow 0.15s;
}
.grid-cell:hover, .grid-cell:focus-visible {
  box-shadow: var(--ds-shadow);
  border-color: var(--ds-color-red-300);
}
.grid-cell.empty {
  background: var(--ds-surface-muted);
  opacity: 0.6;
}
.grid-cell-header {
  font-size: var(--ds-font-size-xs);
  font-weight: bold;
  margin-bottom: var(--ds-spacing-xs);
  display: flex;
  justify-content: space-between;
}
.grid-cell-count {
  background: var(--ds-surface);
  border-radius: var(--ds-radius-sm);
  padding: 0 4px;
  font-size: var(--ds-font-size-xs);
}
.grid-cell-cases {
  font-size: var(--ds-font-size-xs);
  color: var(--ds-text-secondary);
  line-height: 1.3;
}
.grid-cell-case {
  display: block;
  padding: 2px 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.heat-1 { background: var(--ds-color-red-100); }
.heat-2 { background: var(--ds-color-red-100); border: 1px solid var(--ds-color-red-200); }
.heat-3 { background: var(--ds-color-red-200); }
.heat-4 { background: var(--ds-color-red-300); color: var(--ds-surface); }
.heat-5 { background: var(--ds-color-red-400); color: var(--ds-surface); }

/* Shapes - autonomy dots */
.autonomy-dots, .maturity-bar { display: inline-flex; align-items: center; gap: 3px; }
.autonomy-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 1px solid var(--ds-text-primary);
  background: transparent;
}
.autonomy-dot.filled { background: var(--ds-text-primary); }
.maturity-step {
  width: 12px;
  height: 6px;
  border: 1px solid var(--ds-text-primary);
  background: transparent;
}
.maturity-step.filled { background: var(--ds-text-primary); }
.maturity-step:first-child { border-radius: 2px 0 0 2px; }
.maturity-step:last-child { border-radius: 0 2px 2px 0; }

/* Enablers */
.enablers-band {
  margin-top: var(--ds-spacing-lg);
  padding: var(--ds-spacing-md);
  background: var(--ds-surface-raised);
  border: 1px dashed var(--ds-border);
  border-radius: var(--ds-radius-md);
}
.enablers-band h3 {
  font-size: var(--ds-font-size-sm);
  margin: 0 0 var(--ds-spacing-xs);
  color: var(--ds-text-muted);
  text-transform: uppercase;
}
.enablers-band p.note {
  font-size: var(--ds-font-size-xs);
  color: var(--ds-text-muted);
  margin: 0 0 var(--ds-spacing-sm);
  font-style: italic;
}
.enablers-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--ds-spacing-sm);
}
.enabler-item {
  padding: var(--ds-spacing-sm);
  background: var(--ds-surface);
  border: 1px solid var(--ds-border-light);
  border-radius: var(--ds-radius-sm);
  font-size: var(--ds-font-size-sm);
}

/* Lens views */
.lens-header {
  margin-bottom: var(--ds-spacing-md);
}
.lens-header h2 { margin: 0 0 var(--ds-spacing-xs); font-size: var(--ds-font-size-xl); }
.lens-header p { margin: 0; color: var(--ds-text-secondary); font-size: var(--ds-font-size-sm); }
.case-list { display: flex; flex-direction: column; gap: var(--ds-spacing-sm); }
.case-card {
  border: 1px solid var(--ds-border-light);
  border-radius: var(--ds-radius-md);
  padding: var(--ds-spacing-md);
  cursor: pointer;
  background: var(--ds-surface);
}
.case-card:hover { border-color: var(--ds-color-red-300); box-shadow: var(--ds-shadow); }
.case-card h3 { margin: 0 0 var(--ds-spacing-xs); font-size: var(--ds-font-size-base); }
.case-card .one-liner { color: var(--ds-text-secondary); font-size: var(--ds-font-size-sm); margin-bottom: var(--ds-spacing-sm); }
.case-meta { display: flex; flex-wrap: wrap; gap: var(--ds-spacing-md); font-size: var(--ds-font-size-xs); color: var(--ds-text-muted); align-items: center; }
.meta-label { font-weight: bold; color: var(--ds-text-secondary); }

/* Detail view */
.detail-view { max-width: 800px; }
.detail-view h2 { font-size: var(--ds-font-size-xl); margin: 0 0 var(--ds-spacing-xs); }
.detail-view .one-liner { color: var(--ds-text-secondary); margin-bottom: var(--ds-spacing-md); }
.detail-section { margin-bottom: var(--ds-spacing-md); }
.detail-section h3 { font-size: var(--ds-font-size-sm); text-transform: uppercase; color: var(--ds-text-muted); margin: 0 0 var(--ds-spacing-xs); }
.detail-section p, .detail-section ul { margin: 0; font-size: var(--ds-font-size-sm); }
.detail-section ul { padding-left: var(--ds-spacing-lg); }
.detail-actions { display: flex; flex-wrap: wrap; gap: var(--ds-spacing-sm); margin-top: var(--ds-spacing-lg); }
.detail-actions button, .detail-actions a {
  min-height: var(--ds-touch-min);
  padding: 0 var(--ds-spacing-md);
  border: 1px solid var(--ds-border);
  border-radius: var(--ds-radius-sm);
  background: var(--ds-surface);
  cursor: pointer;
  font-size: var(--ds-font-size-sm);
  display: inline-flex;
  align-items: center;
  text-decoration: none;
  color: var(--ds-text-primary);
}
.detail-actions button.primary {
  background: var(--ds-color-red-400);
  color: var(--ds-surface);
  border-color: var(--ds-color-red-500);
}
.detail-actions button:hover, .detail-actions a:hover { background: var(--ds-surface-muted); }
.detail-actions button.primary:hover { background: var(--ds-color-red-500); }
.impact-bar {
  display: flex;
  gap: 2px;
  margin-top: var(--ds-spacing-xs);
}
.impact-seg {
  flex: 1;
  height: 8px;
  background: var(--ds-surface-muted);
  border-radius: 1px;
}
.impact-seg.on { background: var(--ds-color-red-400); }
.driver-tags { display: flex; flex-wrap: wrap; gap: var(--ds-spacing-xs); }
.driver-tag {
  font-size: var(--ds-font-size-xs);
  padding: 2px 8px;
  border: 1px solid var(--ds-border);
  border-radius: var(--ds-radius-sm);
  background: var(--ds-surface-raised);
}

/* Prioritisation 2x2 */
.prioritisation-wrap { max-width: 700px; margin: 0 auto; }
.prioritisation-chart {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  border-left: 3px solid var(--ds-text-primary);
  border-bottom: 3px solid var(--ds-text-primary);
  margin: var(--ds-spacing-lg) 0 var(--ds-spacing-md) 60px;
  background: var(--ds-surface-raised);
}
.prioritisation-chart .y-labels {
  position: absolute;
  left: -60px;
  top: 0;
  bottom: 0;
  width: 55px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  font-size: var(--ds-font-size-xs);
  color: var(--ds-text-secondary);
  text-align: right;
  padding-right: var(--ds-spacing-xs);
}
.prioritisation-chart .x-labels {
  position: absolute;
  left: 0;
  right: 0;
  bottom: -28px;
  display: flex;
  justify-content: space-between;
  font-size: var(--ds-font-size-xs);
  color: var(--ds-text-secondary);
}
.prioritisation-chart .quadrant-labels {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.prioritisation-chart .quad-label {
  position: absolute;
  font-size: var(--ds-font-size-xs);
  color: var(--ds-text-muted);
  padding: var(--ds-spacing-xs);
}
.prioritisation-chart .quad-label.tl { top: 0; left: 0; }
.prioritisation-chart .quad-label.tr { top: 0; right: 0; }
.prioritisation-chart .quad-label.bl { bottom: 0; left: 0; }
.prioritisation-chart .quad-label.br { bottom: 0; right: 0; }
.prioritisation-chart .mid-v, .prioritisation-chart .mid-h {
  position: absolute;
  background: var(--ds-border-light);
}
.prioritisation-chart .mid-v { top: 0; bottom: 0; left: 50%; width: 1px; }
.prioritisation-chart .mid-h { left: 0; right: 0; top: 50%; height: 1px; }
.prio-dot {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--ds-color-red-400);
  border: 1px solid var(--ds-surface);
  transform: translate(-50%, 50%);
  cursor: pointer;
}
.prio-dot:hover { width: 14px; height: 14px; background: var(--ds-color-red-500); }
.prio-legend { font-size: var(--ds-font-size-xs); color: var(--ds-text-muted); }

/* Maturity horizon */
.maturity-horizon { overflow-x: auto; }
.maturity-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--ds-font-size-sm);
}
.maturity-table th, .maturity-table td {
  border: 1px solid var(--ds-border-light);
  padding: var(--ds-spacing-sm);
  text-align: left;
  vertical-align: top;
}
.maturity-table th { background: var(--ds-surface-raised); font-size: var(--ds-font-size-xs); }
.maturity-col-header { display: flex; flex-direction: column; align-items: center; gap: 4px; }

/* Autonomy ladder */
.autonomy-ladder { max-width: 700px; }
.autonomy-tier {
  display: flex;
  gap: var(--ds-spacing-md);
  padding: var(--ds-spacing-md);
  border: 1px solid var(--ds-border-light);
  border-radius: var(--ds-radius-md);
  margin-bottom: var(--ds-spacing-sm);
  align-items: flex-start;
}
.autonomy-tier-num {
  font-size: var(--ds-font-size-xl);
  font-weight: bold;
  color: var(--ds-color-red-400);
  min-width: 32px;
}
.autonomy-tier h3 { margin: 0 0 var(--ds-spacing-xs); font-size: var(--ds-font-size-base); }
.autonomy-tier p { margin: 0; font-size: var(--ds-font-size-sm); color: var(--ds-text-secondary); }
.autonomy-tier .cases { margin-top: var(--ds-spacing-sm); font-size: var(--ds-font-size-xs); }

/* Shortlist */
.shortlist-view h2 { margin: 0 0 var(--ds-spacing-md); }
.shortlist-empty { color: var(--ds-text-muted); font-style: italic; }
.shortlist-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--ds-spacing-sm) var(--ds-spacing-md);
  border: 1px solid var(--ds-border-light);
  border-radius: var(--ds-radius-sm);
  margin-bottom: var(--ds-spacing-sm);
  gap: var(--ds-spacing-md);
}
.shortlist-item-info { flex: 1; min-width: 0; }
.shortlist-item-info strong { display: block; }
.shortlist-item-info span { font-size: var(--ds-font-size-xs); color: var(--ds-text-muted); }
.shortlist-actions { display: flex; gap: var(--ds-spacing-sm); margin-top: var(--ds-spacing-md); }

/* Story mode */
.story-view {
  max-width: 720px;
  margin: 0 auto;
}
.story-view h2 { font-size: var(--ds-font-size-xl); margin: 0 0 var(--ds-spacing-md); }
.story-view .story-body { font-size: var(--ds-font-size-base); line-height: 1.6; margin-bottom: var(--ds-spacing-lg); }
.story-view .story-body p { margin: 0 0 var(--ds-spacing-md); }
.story-view .callout {
  background: var(--ds-color-red-100);
  border-left: 4px solid var(--ds-color-red-400);
  padding: var(--ds-spacing-md);
  margin: var(--ds-spacing-md) 0;
  font-size: var(--ds-font-size-sm);
}
.story-nav {
  display: flex;
  justify-content: space-between;
  gap: var(--ds-spacing-md);
  margin-top: var(--ds-spacing-lg);
}
.story-nav button {
  min-height: var(--ds-touch-min);
  padding: 0 var(--ds-spacing-lg);
  border: 1px solid var(--ds-border);
  border-radius: var(--ds-radius-sm);
  background: var(--ds-surface);
  cursor: pointer;
  font-size: var(--ds-font-size-sm);
}
.story-nav button.primary {
  background: var(--ds-color-red-400);
  color: var(--ds-surface);
  border-color: var(--ds-color-red-500);
}
.story-progress {
  font-size: var(--ds-font-size-xs);
  color: var(--ds-text-muted);
  margin-bottom: var(--ds-spacing-sm);
}

/* Rule banner */
.rule-banner {
  background: var(--ds-color-red-100);
  border: 1px solid var(--ds-color-red-200);
  border-radius: var(--ds-radius-md);
  padding: var(--ds-spacing-md);

  useCases: [{"id":"plan-predictive-01","stage":"plan","tech":"predictive","robotics":false,"name":"Demand Forecasting Engine","oneLiner":"Multi-echelon demand signals fused for S&OP accuracy","how":"Gradient-boosted and temporal fusion models ingest POS, distributor, weather, and macro signals. Hierarchical reconciliation ensures plant-level forecasts roll up consistently to family and SKU.","drivers":["revenue","cost"],"autonomy":2,"maturity":"proven","impact":5,"feasibility":4,"prerequisites":["Clean historical shipment data 24+ months","Master data harmonised across ERP instances","Forecast accuracy baseline established"],"valueRange":"2-5% revenue uplift from fill-rate improvement; 5-15% inventory reduction","keyRisk":"Overfitting to pre-disruption demand patterns; model drift after portfolio changes","exemplar":"Global CPG manufacturer with 12 plants and 800 SKUs"},{"id":"plan-predictive-02","stage":"plan","tech":"predictive","robotics":false,"name":"Capacity & Constraint Optimiser","oneLiner":"Finite-capacity planning with bottleneck sensitivity","how":"Mixed-integer optimisation models plant routings, changeover matrices, and labour calendars. Monte Carlo simulation quantifies schedule risk under demand uncertainty.","drivers":["cost","capital"],"autonomy":2,"maturity":"scaling","impact":4,"feasibility":3,"prerequisites":["Accurate routings and standard times in MES/ERP","Changeover matrix maintained","Solver licence and OR expertise on staff"],"valueRange":"3-8% throughput gain on constrained lines; 10-20% reduction in expediting","keyRisk":"Optimisation outputs ignored by planners who distrust black-box schedules","exemplar":"Automotive tier-1 with shared bottleneck paint shop"},{"id":"plan-generative-01","stage":"plan","tech":"generative","robotics":false,"name":"S&OP Narrative Copilot","oneLiner":"Drafts executive S&OP pack from live plan data","how":"LLM retrieves current forecast, inventory, and capacity snapshots via structured queries, then generates lling to use simulation evidence"],"valueRange":"5-15% CapEx avoidance on greenfield; 10-25% logistics cost reduction on re-layout","keyRisk":"Simulation calibrated on current state fails to capture future product mix","exemplar":"Electronics assembler evaluating Southeast Asia greenfield"},{"id":"design-predictive-01","stage":"design","tech":"predictive","robotics":false,"name":"Design-for-Manufacturability Scorer","oneLiner":"Predicts yield and cost impact of design choices","how":"Regression and classification models trained on historical NPI data score draft BOMs and tolerances for predicted first-pass yield, tooling cost, and cycle time before release to production.","drivers":["cost","capital"],"autonomy":2,"maturity":"scaling","impact":4,"feasibility":3,"prerequisites":["Historical NPI outcomes linked to design attributes","PLM integration for automated scoring","Engineering workflow gate that respects scores"],"valueRange":"5-12% reduction in NPI cost overruns; 15-30% fewer late design changes","keyRisk":"Model trained on legacy processes penalises genuinely novel designs","exemplar":"Medical device OEM with high mix/low volume NPI"},{"id":"design-generative-01","stage":"design","tech":"generative","robotics":false,"name":"Engineering Spec Copilot","oneLiner":"Drafts and cross-references technical specifications","how":"RAG over standards libraries, past product specs, and regulatory requirements generates draft specifications with traceable citations. Flags conflicts between sub-system requirements.","drivers":["cost","risk"],"autonomy":2,"maturity":"scaling","impact":3,"feasibility":4,"prerequisites":["Curated standards and spec corpus","PLM document management integration","Engineer review workflow mandatory"],"valueRange":"20-40% reduction in spec authoring time; fewer compliance gaps","keyRisk":"Missing a critical regulatory clause that was not in the retrieval corpus","exemplar":"Aerospace sub-system supplier under AS9100"},{"id":"design-generative-02" raints.","drivers":["cost","sustainability"],"autonomy":2,"maturity":"scaling","impact":4,"feasibility":2,"prerequisites":["FEA/CFD baseline models validated","Manufacturing process constraints encoded","Post-processing for machinability review"],"valueRange":"10-30% material reduction on structural parts; longer lead time on first articles","keyRisk":"Optimised designs that cannot be inspected or assembled with existing tooling","exemplar":"Automotive lightweighting programme for EV chassis components"},{"id":"design-physics-02","stage":"design","tech":"physics","robotics":false,"name":"Assembly Sequence Simulator","oneLiner":"3-D digital mock-up validates assembly order and ergonomics","how":"Physics engine simulates part insertion paths, fastener access, and operator reach envelopes. Flags collisions and impossible sequences before tooling commitment.","drivers":["capital","cost"],"autonomy":2,"maturity":"proven","impact":4,"feasibility":3,"prerequisites":["Complete 3-D CAD assembly model","Ergonomics standards defined","Cross-functional sign-off process"],"valueRange":"Avoidance of one tooling rework typically saves $200K-$2M depending on industry","keyRisk":"Simulation assumes ideal part geometry; real tolerances create fit issues","exemplar":"White-goods manufacturer launching new platform"},{"id":"source-predictive-01","stage":"source","tech":"predictive","robotics":false,"name":"Supplier Risk Scoring","oneLiner":"Multi-factor supplier failure and delay prediction","how":"Models ingest financial health, geopolitical exposure, quality history, and logistics performance to produce dynamic risk scores. Alerts trigger before PO placement.","drivers":["risk","cost"],"autonomy":2,"maturity":"scaling","impact":4,"feasibility":4,"prerequisites":["Supplier master data with tier mapping","External data feeds (credit, geo, logistics)","Procurement workflow that consumes scores"],"valueRange":"Single avoided line-down event often exceeds $1M; ongoing 2-5% spend risk reduction","keyRisk":"False negatives on novel disruption types not in training data","exemplar":"Multi-national industrial conglomerate with 3,000+ active suppliers"},{"id":"source-predictive-02","stage":"source","tech":"predictive","robotics":false,"name":"Should-Cost Modeller","oneLiner":"Predicts fair cost from material, labour, and process drivers","how":"Regression models decompose should-cost from commodity indices, wage rates, process parameters, and complexity factors. Flags outliers in supplier quotes for negotiation.","drivers":["cost"],"autonomy":2,"maturity":"proven","impact":4,"feasibility":3,"prerequisites":["Commodity and labour index subscriptions","BOM-level cost decomposition capability","Category managers trained on model limitations"],"valueRange":"3-8% procurement savings on negotiated categories","keyRisk":"Model misses supplier-specific innovations that justify premium pricing","exemplar":"Automotive OEM sourcing stamped metal assemblies"},{"id":"source-generative-01","stage":"source","tech":"generative","robotics":false,"name":"RFP & Contract Drafting Assistant","oneLiner":"Generates sourcing documents from templates and history","how":"LLM assembles RFP sections, terms, and SLA language from approved clause library and prior award history. Highlights non-standard terms for legal review.","drivers":["cost"],"autonomy":1,"maturity":"scaling","impact":2,"feasibility":4,"prerequisites":["Approved legal clause library","Template governance process","Mandatory legal review gate"],"valueRange":"40-60% faster RFP cycle time on standard categories","keyRisk":"Non-standard liability clauses slip through if library is stale","exemplar":"Process manufacturer sourcing raw materials globally"},{"id":"source-vision-01","stage":"source","tech":"vision","robotics":false,"name":"Incoming Certificate Verification","oneLiner":"Vision checks material certs against PO specifications","how":"OCR and document layout models extract mill cert fields (grade, heat lot, chemistry). Vision validates stamp authenticity and cross-checks against PO line requirements.","drivers":["risk","risk"],"autonomy":2,"maturity":"proving","impact":3,"feasibility":3,"prerequisites":["Digital cert ingestion pipeline","PO-spec matching rules engine","Human escalation for borderline cases"],"valueRange":"Reduced incoming material holds; 30-50% faster cert processing","keyRisk":"Sophisticated forged documentation bypasses visual checks","exemplar":"Steel fabricator receiving mill certificates from multiple mills"},{"id":"make-predictive-01","stage":"make","tech":"predictive","robotics":false,"name":"Predictive Maintenance on Critical Assets","oneLiner":"Remaining useful life from vibration, thermal, and process signals","how":"Time-series models on sensor streams detect degradation signatures weeks before failure. Work orders auto-generated with parts staging recommendations.","drivers":["cost","risk"],"autonomy":3,"maturity":"proven","impact":5,"feasibility":4,"prerequisites":["Sensor infrastructure on critical assets","Historian with labelled failure events","Maintenance workflow integrated with CMMS"],"valueRange":"10-25% maintenance cost reduction; 30-50% reduction in unplanned downtime on covered assets","keyRisk":"Alert fatigue from false positives erodes operator trust","exemplar":"Chemical plant with 200 rotating assets under monitoring"},{"id":"make-predictive-02","stage":"make","tech":"predictive","robotics":false,"name":"Process Parameter Optimisation","oneLiner":"Real-time setpoint adjustment within safe operating envelope","how":"Reinforcement learning or Bayesian optimisation tunes temperature, pressure, and feed rates within validated bounds. Closed-loop recommendations to operators or DCS.","drivers":["cost","sustainability"],"autonomy":3,"maturity":"scaling","impact":5,"feasibility":3,"prerequisites":["Validated process model or sufficient DOE history","DCS integration with override safeguards","Operator training on advisory vs autonomous modes"],"valueRange":"2-8% yield improvement; 3-10% energy reduction on optimised units","keyRisk":"Optimiser explores unsafe region if guardrails are incomplete","exemplar":"Specialty chemicals reactor with batch-to-batch variability"},{"id":"make-generative-01","stage":"make","tech":"generative","robotics":false,"name":"Work Instruction Copilot","oneLiner":"Generates and updates shop-floor work instructions from engineering changes","how":"LLM pulls latest BOM, routing, and quality requirements to draft step-by-step instructions with embedded images. Auto-updates when ECO released.","drivers":["cost","risk"],"autonomy":2,"maturity":"scaling","impact":3,"feasibility":4,"prerequisites":["PLM-MES integration for ECO triggers","Standard work template library","Supervisor approval before floor release"],"valueRange":"50-70% faster work instruction updates; fewer defects from stale instructions","keyRisk":"Instruction omits critical safety step not captured in source data","exemplar":"Aerospace MRO facility with frequent engineering changes"},{"id":"make-vision-01","stage":"make","tech":"vision","robotics":false,"name":"In-line Surface Inspection","oneLiner":"2-D vision detects cosmetic and coating defects at line speed","how":"Convolutional networks trained on defect libraries classify scratches, dents, and coating anomalies on moving product. Rejects routed automatically with image evidence.","drivers":["cost","risk"],"autonomy":3,"maturity":"proven","impact":4,"feasibility":4,"prerequisites":["Controlled lighting and camera mounting","Labelled defect image library 500+ per class","Line stop/reject mechanism integrated"],"valueRange":"30-60% reduction in downstream quality escapes; 15-25% less rework","keyRisk":"Novel defect types not in training set pass undetected until customer complaint","exemplar":"Automotive body panel line running 60 jobs/hour"},{"id":"make-vision-02","stage":"make","tech":"vision","robotics":false,"name":"Operator Safety Monitoring","oneLiner":"Video analytics detects PPE violations and zone breaches","how":"Real-time object detection tracks personnel, PPE compliance, and restricted zone entry. Alerts to supervisor dashboard; incident clips archived for review.","drivers":["risk"],"autonomy":3,"maturity":"scaling","impact":4,"feasibility":3,"prerequisites":["Camera coverage of hazard zones","Privacy and works council agreement","Incident response protocol defined"],"valueRange":"20-40% reduction in recordable incidents where deployed; insurance premium impact varies","keyRisk":"False alarms desensitise supervisors; privacy backlash if poorly communicated","exemplar":"Steel mill with molten metal handling zones"},{"id":"make-physics-01","stage":"make","tech":"physics","robotics":true,"name":"Adaptive Robotic Welding","oneLiner":"Robot adjusts weld path from 3-D seam profile sensing","how":"Structured light or laser profiling captures seam geometry; physics-informed path planner adjusts torch angle, speed, and weave in real time. Closed-loop quality verification.","drivers":["cost","risk"],"autonomy":4,"maturity":"scaling","impact":5,"feasibility":3,"prerequisites":["Robot with force/torque and vision guidance","Welding procedure qualification for adaptive mode","Skilled robot programmer for edge cases"],"valueRange":"20-40% reduction in weld rework; 10-15% cycle time improvement on variable joints","keyRisk":"Unqualified adaptive parameters on new joint geometries","exemplar":"Heavy fabrication shop with mixed batch welding"},{"id":"make-physics-02","stage":"make","tech":"physics","robotics":true,"name":"Cobotic Assembly Assist","oneLiner":"Collaborative robots assist with precise insertion tasks","how":"Force-controlled cobots guide operators through insertion paths with haptic feedback. 3-D vision confirms alignment before release. Learns operator pace over shifts.","drivers":["cost"],"autonomy":3,"maturity":"proving","impact":3,"feasibility":3,"prerequisites":["Ergonomic assessment of task suitabilit function meceAudit() {
  const errors = [];
  const cellCounts = {};
  DATA.stages.forEach(s => DATA.tech.forEach(t => { cellCounts[s + "-" + t] = 0; }));
  DATA.useCases.forEach(uc => {
    if (!DATA.stages.includes(uc.stage)) errors.push(uc.id + ": invalid stage " + uc.stage);
    if (!DATA.tech.includes(uc.tech)) errors.push(uc.id + ": invalid tech " + uc.tech);
    if (uc.autonomy < 1 || uc.autonomy > 4) errors.push(uc.id + ": invalid autonomy");
    if (!DATA.maturity.includes(uc.maturity)) errors.push(uc.id + ": invalid maturity");
    uc.drivers.forEach(d => { if (!DATA.drivers.includes(d)) errors.push(uc.id + ": invalid driver " + d); });
    if (uc.tech !== "physics" && uc.robotics) errors.push(uc.id + ": robotics flag on non-physics tech");
    cellCounts[uc.stage + "-" + uc.tech]++;
  });
  const empty = Object.keys(cellCounts).filter(k => cellCounts[k] === 0);
  console.log("MECE Audit: " + DATA.useCases.length + " use cases");
  console.log("Cell distribution:", cellCounts);
  console.log("Empty cells (" + empty.length + "):", empty.join(", ") || "none");
  if (errors.length) {
    console.error("MECE ERRORS:", errors);
  } else {
    console.log("MECE audit PASSED");
  }
  return { errors, cellCounts, empty };
}

const state = {
  mode: "entry",
  shortlist: JSON.parse(localStorage.getItem("ai-mfg-shortlist") || "[]"),
  filters: { driver: "", autonomy: "", maturity: "", robotics: false, search: "" },
  storyStep: 1
};

function saveShortlist() {
  localStorage.setItem("ai-mfg-shortlist", JSON.stringify(state.shortlist));
}

function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function autonomyDots(level) {
  let h = '<span class="autonomy-dots" aria-label="Autonomy level ' + level + '">';
  for (let i = 1; i <= 4; i++) h += '<span class="autonomy-dot' + (i <= level ? ' filled' : '') + '"></span>';
  return h + '</span>';
}

function maturityBar(mat) {
  const idx = DATA.maturity.indexOf(mat);
  let h = '<span class="maturity-bar" aria-label="Maturity ' + DATA.maturityLabels[mat] + '">';
  DATA.maturity.forEach((m, i) => h += '<span class="maturity-step' + (i <= idx ? ' filled' : '') + '"></span>');
  return h + '</span>';
}

function heatClass(impact) {
  return "heat-" + Math.min(5, Math.max(1, impact));
}

function avgImpact(cases) {
  if (!cases.length) return 0;
  return cases.reduce((s, c) => s + c.impact, 0) / cases.length;
}

function filteredCases(cases) {
  return cases.filter(uc => {
    if (state.filters.driver && !uc.drivers.includes(state.filters.driver)) return false;
    if (state.filters.autonomy && uc.autonomy !== parseInt(state.filters.autonomy)) return false;
    if (state.filters.maturity && uc.maturity !== state.filters.maturity) return false;
    if (state.filters.robotics && !uc.robotics) return false;
    if (state.filters.search) {
      const q = state.filters.search.toLowerCase();
      const hay = (uc.name + " " + uc.oneLiner + " " + uc.how).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function getCasesForCell(stage, tech) {
  return filteredCases(DATA.useCases.filter(uc => uc.stage === stage && uc.tech === tech));
}

function parseRoute() {
  const hash = location.hash.slice(1) || "/";
  const parts = hash.split("/").filter(Boolean);
  if (!parts.length || parts[0] === "") return { view: "entry" };
  if (parts[0] === "landscape") return { view: "landscape" };
  if (parts[0] === "stage" && parts[1]) return { view: "stage", stage: parts[1] };
  if (parts[0] === "tech" && parts[1]) return { view: "tech", tech: parts[1] };
  if (parts[0] === "cell" && parts[1] && parts[2]) return { view: "cell", stage: parts[1], tech: parts[2] };
  if (parts[0] === "case" && parts[1]) return { view: "case", id: parts[1] };
  if (parts[0] === "prioritisation") return { view: "prioritisation" };
  if (parts[0] === "maturity") return { view: "maturity" };
  if (parts[0] === "autonomy") return { view: "autonomy" };
  if (parts[0] === "shortlist") return { view: "shortlist" };
  if (parts[0] === "story" && parts[1]) return { view: "story", step: parseInt(parts[1]) || 1 };
  return { view: "entry" };
}

  location.hash = path;
}

function renderBreadcrumb(route) {
  const crumbs = [{ label: "Home", path: "#/" }];
  if (route.view === "landscape") crumbs.push({ label: "Landscape", path: "#/landscape" });
  else if (route.view === "stage") {
    crumbs.push({ label: "Landscape", path: "#/landscape" });
    crumbs.push({ label: DATA.stageLabels[route.stage], path: "#/stage/" + route.stage });
  } else if (route.view === "tech") {
    crumbs.push({ label: "Landscape", path: "#/landscape" });
    crumbs.push({ label: DATA.techLabels[route.tech], path: "#/tech/" + route.tech });
  } else if (route.view === "cell") {
    crumbs.push({ label: "Landscape", path: "#/landscape" });
    crumbs.push({ label: DATA.stageLabels[route.stage], path: "#/stage/" + route.stage });
    crumbs.push({ label: DATA.techLabels[route.tech], path: "#/cell/" + route.stage + "/" + route.tech });
  } else if (route.view === "case") {
    const uc = DATA.useCases.find(c => c.id === route.id);
    if (uc) {
      crumbs.push({ label: "Landscape", path: "#/landscape" });
      crumbs.push({ label: DATA.stageLabels[uc.stage], path: "#/stage/" + uc.stage });
      crumbs.push({ label: DATA.techLabels[uc.tech], path: "#/cell/" + uc.stage + "/" + uc.tech });
      crumbs.push({ label: uc.name, path: "#/case/" + uc.id });
    }
  } else if (route.view === "prioritisation") crumbs.push({ label: "Prioritisation", path: "#/prioritisation" });
  else if (route.view === "maturity") crumbs.push({ label: "Maturity Horizon", path: "#/maturity" });
  else if (route.view === "autonomy") crumbs.push({ label: "Autonomy Ladder", path: "#/autonomy" });
  else if (route.view === "shortlist") crumbs.push({ label: "Shortlist", path: "#/shortlist" });
  else if (route.view === "story") crumbs.push({ label: "Guided Story", path: "#/story/" + route.step });

  let h = '<nav class="breadcrumb" aria-label="Breadcrumb">';
  crumbs.forEach((c, i) => {
    if (i > 0) h += '<span class="sep">/</span>';
    if (i === crumbs.length - 1) h += '<span>' + escapeHtml(c.label) + '</span>';
    else h += '<a data-nav="' + c.path + '">' + escapeHtml(c.label) + '</a>';
  });
  h += '</nav>';
  return h;
}

function renderStepper(type, current) {
  const list = type === "stage" ? DATA.stages : DATA.tech;
  const labels = type === "stage" ? DATA.stageLabels : DATA.techLabels;
  const idx = list.indexOf(current);
  const prev = idx > 0 ? list[idx - 1] : null;
  const next = idx < list.length - 1 ? list[idx + 1] : null;
  const base = type === "stage" ? "#/stage/" : "#/tech/";
  let h = '<div class="stepper">';
  h += '<button type="button" data-nav="' + (prev ? base + prev : '#') + '"' + (prev ? '' : ' disabled') + ' aria-label="Previous">&#8592;</button>';
  h += '<span class="stepper-label">' + labels[current] + ' (' + (idx + 1) + ' of ' + list.length + ')</span>';
  h += '<button type="button" data-nav="' + (next ? base + next : '#') + '"' + (next ? '' : ' disabled') + ' aria-label="Next">&#8594;</button>';
  h += '</div>';
  return h;
}

function renderLandscape() {
  let h = '<div class="rule-banner"><strong>Highest-rung rule:</strong> Classify each use case at the highest technology rung it genuinely requires. If a solution uses vision models on top of physics simulation, place it at Physics AI — not Vision AI.</div>';
  h += '<div class="landscape-grid">';
  DATA.stages.forEach(stage => {
    DATA.tech.forEach(tech => {
      const cases = getCasesForCell(stage, tech);
      const heat = cases.length ? Math.round(avgImpact(cases)) : 0;
      h += '<div class="grid-cell' + (cases.length ? ' ' + heatClass(heat) : ' empty') + '" data-cell="' + stage + '/' + tech + '" tabindex="0" role="button" aria-label="' + DATA.stageLabels[stage] + ' x ' + DATA.techLabels[tech] + ', ' + cases.length + ' use cases">';
      h += '<div class="grid-cell-header"><span>' + DATA.stageLabels[stage] + '</span><span class="grid-cell-count">' + cases.length + '</span></div>';
      h += '<div class="grid-cell-cases">';
      cases.slice(0, 3).forEach(uc => h += '<span class="grid-cell-case">' + escapeHtml(uc.name) + '</span>');
      if (cases.length > 3) h += '<span class="grid-cell-case">+' + (cases.length - 3) + ' more</span>';
      h += '</div></div>';
    });
  });
  h += '</div>';
  h += renderEnablers();
  return h;
}

}

function renderCellView(stage, tech) {
  const cases = getCasesForCell(stage, tech);
  let h = '<div class="lens-header"><h2>' + DATA.stageLabels[stage] + ' x ' + DATA.techLabels[tech] + '</h2>';
  h += '<p>' + cases.length + ' use case' + (cases.length !== 1 ? 's' : '') + ' in this cell.</p></div>';
  h += '<div class="case-list">';
  cases.forEach(uc => h += renderCaseCard(uc));
  h += '</div>';
  return h;
}

function renderDetail(id) {
  const uc = DATA.useCases.find(c => c.id === id);
  if (!uc) return '<p>Use case not found.</p>';
  const inList = state.shortlist.includes(uc.id);
  let h = '<div class="detail-view">';
  h += '<h2>' + escapeHtml(uc.name) + '</h2>';
  h += '<p class="one-liner">' + escapeHtml(uc.oneLiner) + '</p>';
  h += '<div class="detail-section"><h3>How it works</h3><p>' + escapeHtml(uc.how) + '</p></div>';
  h += '<div class="detail-section"><h3>Value drivers</h3><div class="driver-tags">';
  uc.drivers.forEach(d => h += '<span class="driver-tag">' + DATA.driverLabels[d] + '</span>');
  h += '</div></div>';
  h += '<div class="detail-section"><h3>Autonomy &amp; Maturity</h3><p>Autonomy: ' + autonomyDots(uc.autonomy) + ' ' + DATA.autonomyLabels[uc.autonomy] + '<br>Maturity: ' + maturityBar(uc.maturity) + ' ' + DATA.maturityLabels[uc.maturity] + (uc.robotics ? '<br>Robotics-enabled (Physics AI)' : '') + '</p></div>';
  h += '<div class="detail-section"><h3>Impact &amp; Feasibility</h3><p>Impact: ' + uc.impact + '/5 | Feasibility: ' + uc.feasibility + '/5</p>';
  h += '<div class="impact-bar" aria-hidden="true">';
  for (let i = 1; i <= 5; i++) h += '<div class="impact-seg' + (i <= uc.impact ? ' on' : '') + '"></div>';
  h += '</div></div>';
  h += '<div class="detail-section"><h3>Value range</h3><p>' + escapeHtml(uc.valueRange) + '</p></div>';
  h += '<div class="detail-section"><h3>Prerequisites</h3><ul>';
  uc.prerequisites.forEach(p => h += '<li>' + escapeHtml(p) + '</li>');
  h += '</ul></div>';
  h += '<div class="detail-section"><h3>Key risk</h3><p>' + escapeHtml(uc.keyRisk) + '</p></div>';
  h += '<div class="detail-section"><h3>Exemplar</h3><p>' + escapeHtml(uc.exemplar) + '</p></div>';
  h += '<div class="detail-actions">';
  h += '<button type="button" class="primary" id="btn-shortlist">' + (inList ? 'Remove from shortlist' : 'Add to shortlist') + '</button>';
  h += '<a data-nav="#/stage/' + uc.stage + '">Pivot: ' + DATA.stageLabels[uc.stage] + ' stage</a>';
  h += '<a data-nav="#/tech/' + uc.tech + '">Pivot: ' + DATA.techLabels[uc.tech] + '</a>';
  h += '<a data-nav="#/cell/' + uc.stage + '/' + uc.tech + '">Pivot: Cell view</a>';
  h += '<a data-nav="#/prioritisation">Pivot: Prioritisation</a>';
  h += '</div></div>';
  return h;
}

function renderPrioritisation() {
  const cases = filteredCases(DATA.useCases);
  let h = '<div class="prioritisation-wrap"><h2>Prioritisation Matrix</h2>';
  h += '<p style="font-size:var(--ds-font-size-sm);color:var(--ds-text-secondary)">Impact (Y) vs Feasibility (X). Y-axis labels only; X-axis visible at 3px black.</p>';
  h += '<div class="prioritisation-chart" role="img" aria-label="Impact vs feasibility scatter plot">';
  h += '<div class="y-labels"><span>High impact</span><span>Low impact</span></div>';
  h += '<div class="x-labels"><span>Low feasibility</span><span>High feasibility</span></div>';
  h += '<div class="mid-v"></div><div class="mid-h"></div>';
  h += '<div class="quadrant-labels">';
  h += '<span class="quad-label tl">Invest &amp; build</span>';
  h += '<span class="quad-label tr">Quick wins</span>';
  h += '<span class="quad-label bl">Deprioritise</span>';
  h += '<span class="quad-label br">Long-term bets</span>';
  h += '</div>';
  cases.forEach(uc => {
    const x = ((uc.feasibility - 1) / 4) * 100;
    const y = ((uc.impact - 1) / 4) * 100;
    h += '<div class="prio-dot" style="left:' + x + '%;bottom:' + y + '%" data-case="' + uc.id + '" title="' + escapeHtml(uc.name) + '"></div>';
  });
  h += '</div>';
  h += '<p class="prio-legend">' + cases.length + ' use cases plotted. Click a dot for details.</p></div>';
  return h;
}

function renderMaturity() {
  const cases = filteredCases(DATA.useCases);
  let h = '<h2>Maturity Horizon</h2><p style="color:var(--ds-text-secondary);font-size:var(--ds-font-size-sm)">Use cases by value chain stage and maturity band. Shape encodes maturity level.</p>';
  h += '<div class="maturity-horizon"><table class="maturity-table"><thead><tr><th>Stage</th>';
  DATA.maturity.forEach(m => {
    h += '<th><div class="maturity-col-header">' + maturityBar(m) + '<span>' + DATA.maturityLabels[m] + '</span></div></th>';
  });
  h += '</tr></thead><tbody>';
  DATA.stages.forEach(stage => {
    h += '<tr><th>' + DATA.stageLabels[stage] + '</th>';
    DATA.maturity.forEach(mat => {
      const cell = cases.filter(uc => uc.stage === stage && uc.maturity === mat);
      h += '<td>';
      cell.forEach(uc => h += '<div><a data-nav="#/case/' + uc.id + '" style="cursor:pointer;color:var(--ds-color-red-400)">' + escapeHtml(uc.name) + '</a></div>');
      h += '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

function renderAutonomy() {
  const cases = filteredCases(DATA.useCases);
  let h = '<div class="autonomy-ladder"><h2>Autonomy Ladder</h2>';
  h += '<div class="rule-banner">Agentic isn\'t a technology you buy — it\'s an autonomy tier you earn. Higher autonomy requires stronger data, governance, and operational readiness.</div>';
  [1,2,3,4].forEach(level => {
    const tierCases = cases.filter(uc => uc.autonomy === level);
    h += '<div class="autonomy-tier"><div class="autonomy-tier-num">' + level + '</div><div>';
    h += '<h3>' + DATA.autonomyLabels[level] + ' ' + autonomyDots(level) + '</h3>';
    h += '<p>' + tierCases.length + ' use case' + (tierCases.length !== 1 ? 's' : '') + ' at this tier.</p>';
    if (tierCases.length) {
      h += '<div class="cases">';
      tierCases.forEach(uc => h += '<a data-nav="#/case/' + uc.id + '" style="cursor:pointer;color:var(--ds-color-red-400);margin-right:8px">' + escapeHtml(uc.name) + '</a>');
      h += '</div>';
    }
    h += '</div></div>';
  });
  h += '</div>';
  return h;
}

function renderShortlist() {
  let h = '<div class="shortlist-view"><h2>Shortlist Basket</h2>';
  if (!state.shortlist.length) {
    h += '<p class="shortlist-empty">No use cases in your shortlist yet. Add cases from detail views.</p>';
  } else {
    state.shortlist.forEach(id => {
      const uc = DATA.useCases.find(c => c.id === id);
      if (!uc) return;
      h += '<div class="shortlist-item"><div class="shortlist-item-info"><strong>' + escapeHtml(uc.name) + '</strong><span>' + DATA.stageLabels[uc.stage] + ' / ' + DATA.techLabels[uc.tech] + '</span></div>';
      h += '<button type="button" data-nav="#/case/' + uc.id + '">View</button>';
      h += '<button type="button" data-remove="' + uc.id + '">Remove</button></div>';
    });
  }
  h += '<div class="shortlist-actions">';
  h += '<button type="button" id="btn-export"' + (state.shortlist.length ? '' : ' disabled') + '>Export JSON</button>';
  h += '<button type="button" id="btn-clear"' + (state.shortlist.length ? '' : ' disabled') + '>Clear all</button>';
  h += '</div></div>';
  return h;
}

const STORY = [
  { title: "Why now", body: "<p>Manufacturing AI has moved from pilot purgatory to production scale. Sensor density, cloud/edge compute, and foundation models make previously bespoke ML deployable across plants.</p><p>Yet most leadership teams still navigate a fragmented vendor landscape without a shared taxonomy — leading to duplicate investments and missed compounding value.</p>" },
  { title: "Two axes", body: "<p>This landscape is built on two MECE axes:</p><p><strong>Value chain stage</strong> (Plan through Serve) — where in the operating model the use case creates value.</p><p><strong>Technology rung</strong> (Predictive, Generative, Vision, Physics) — the highest AI capability the solution genuinely requires.</p><p>Every use case sits in exactly one cell of the resulting 8x4 grid.</p>" },
  { title: "Why the usual tech list isn't MECE", body: "<p>Vendor slide decks list \"AI use cases\" as an unstructured catalogue: chatbots next to computer vision next to digital twins. Categories overlap, gaps hide, and prioritisation becomes opinion-driven.</p><p>A MECE structure forces explicit choices: which stage, which rung, which autonomy tier. Overlap surfaces immediately; empty cells reveal white space.</p>" },
  { title: "Dimensionality ladder", body: "<p>Technology rungs form a dimensionality ladder — each rung adds richer representation of the physical world:</p><p>Predictive AI learns patterns from data. Generative AI creates content and orchestrates workflows. Vision AI perceives the physical world through cameras. Physics AI simulates and interacts with physical systems — including robotics.</p><p>Higher rungs subsume lower ones in complexity but not in deployment ease.</p>" },
  { title: "Highest-rung rule", body: "<div class=\"callout\"><strong>Highest-rung rule:</strong> Classify each use case at the highest technology rung it genuinely requires. If a solution combines vision with physics simulation or closed-loop robot control, it belongs at Physics AI — not Vision AI.</div><p>This rule prevents double-counting and ensures robotics and digital-twin investments map to the correct strategic bucket.</p>" },
  { title: "Value chain", body: "<p>The eight stages follow the manufacturing value chain from planning through customer service:</p><p>Plan, Design, Source, Make, Quality, Maintain, Deliver, Serve.</p><p>Each stage has distinct data assets, decision cadences, and stakeholder groups — so AI value pools differ materially by stage even when the underlying technology rung is the same.</p>" },
  { title: "Landscape", body: "<p>The 32-cell grid maps 47 use cases. Cell colour intensity reflects average impact (value at stake). Autonomy and maturity are encoded as shapes — not colours — to avoid conflating dimensions.</p><p>Four enabler domains sit below the grid as non-MECE cross-cuts: sustainability, workforce, data/IT-OT, and governance.</p>", action: "#/landscape" },
  { title: "Deep dive: Make x Vision", body: "<p>In-line surface inspection on an automotive body panel line demonstrates Vision AI at production cadence: CNNs classify defects at 60 jobs/hour with automatic reject routing.</p><p>Prerequisites include controlled lighting, 500+ labelled images per defect class, and integrated line-stop mechanisms. Value: 30-60% reduction in downstream quality escapes.</p>", action: "#/case/make-vision-01" },
  { title: "Deep dive: Plan x Predictive", body: "<p>Multi-echelon demand forecasting fuses POS, distributor, weather, and macro signals for S&OP. Hierarchical reconciliation rolls plant forecasts to SKU and family consistently.</p><p>Proven at global CPG scale: 2-5% revenue uplift from fill-rate improvement and 5-15% inventory reduction — but requires 24+ months of clean shipment history.</p>", action: "#/case/plan-predictive-01" },
  { title: "Deep dive: Make x Physics (Robotics)", body: "<p>Adaptive robotic welding adjusts torch path from 3-D seam profile sensing in real time. This is Physics AI with robotics — not a separate category.</p><p>Autonomy tier 4 with scaling maturity. Filter by \"Robotics\" to surface all Physics AI use cases involving physical actuation: welding, cobots, AM digital twins, AMR fleets, inspection robots, and drone surveys.</p>", action: "#/case/make-physics-01" },
  { title: "Autonomy ladder", body: "<p>Autonomy spans four tiers: Assist, Advise, Act with oversight, and Autonomous. Agentic behaviour is earned through data quality, guardrails, and operational trust — not purchased as a product SKU.</p><p>Use cases at tier 3-4 (e.g. predictive maintenance auto-work-orders, label verification gates, AMR fleets) require stronger governance and override mechanisms.</p>", action: "#/autonomy" },
  { title: "Value concentration + prerequisites", body: "<p>High-impact clusters concentrate in Make (predictive maintenance, process optimisation, vision inspection) and Quality (dimensional inspection, X-ray classification). Physics AI cells carry robotics flagships but lower feasibility scores.</p><p>Prerequisites repeat: clean historian data, IT/OT integration, labelled training corpora, and governance gates. Build the enabler foundation before scaling autonomy tiers.</p><p>Use prioritisation and shortlist views to assemble your portfolio.</p>", action: "#/prioritisation" }
];

function renderStory(step) {
  const s = STORY[step - 1];
  if (!s) return '<p>Story complete. <a data-nav="#/landscape">Explore the landscape</a>.</p>';
  let h = '<div class="story-view">';
  h += '<div class="story-progress">Step ' + step + ' of ' + STORY.length + '</div>';
  h += '<h2>' + escapeHtml(s.title) + '</h2>';
  h += '<div class="story-body">' + s.body + '</div>';
  h += '<div class="story-nav">';
  h += '<button type="button" data-nav="#/story/' + Math.max(1, step - 1) + '"' + (step <= 1 ? ' disabled' : '') + '>Previous</button>';
  if (s.action) h += '<button type="button" class="primary" data-nav="' + s.action + '">Explore this</button>';
  h += '<button type="button"' + (step >= STORY.length ? ' data-nav="#/landscape"' : ' data-nav="#/story/' + (step + 1) + '"') + ' class="primary">' + (step >= STORY.length ? 'Finish' : 'Next') + '</button>';
  h += '</div></div>';
  return h;
}

function renderContent(route) {
  switch (route.view) {
    case "landscape": return renderLandscape();
    case "stage": return renderStageLens(route.stage);
    case "tech": return renderTechLens(route.tech);
    case "cell": return renderCellView(route.stage, route.tech);
    case "case": return renderDetail(route.id);
    case "prioritisation": return renderPrioritisation();
    case "maturity": return renderMaturity();
    case "autonomy": return renderAutonomy();
    case "shortlist": return renderShortlist();
    case "story": return renderStory(route.step);
    default: return "";
  }
}

function render() {
  const route = parseRoute();
  const app = document.getElementById("app");
  if (route.view === "entry") {
    app.innerHTML = renderEntry();
    bindEvents(app);
    return;
  }
  const showRails = route.view !== "story";
  let html = '<div class="shell">';
  if (showRails) html += renderLeftRail(route);
  html += '<div class="main-col">';
  if (showRails) html += renderTopRail(route);
  html += renderToolbar(route);
  html += renderBreadcrumb(route);
  html += '<main class="content" id="main-content">' + renderContent(route) + '</main>';
  html += '</div></div>';
  app.innerHTML = html;
  bindEvents(app);
}

function bindEvents(root) {
  root.querySelectorAll("[data-nav]").forEach(el => {
    el.addEventListener("click", e => {
      e.preventDefault();
      navigate(el.getAttribute("data-nav").replace("#", ""));
    });
  });
  root.querySelectorAll(".door").forEach(el => {
    el.addEventListener("click", () => navigate(el.getAttribute("data-nav").replace("#", "")));
  });
  root.querySelectorAll(".stage-btn").forEach(el => {
    el.addEventListener("click", () => navigate("/stage/" + el.getAttribute("data-stage")));
  });
  root.querySelectorAll(".tech-btn").forEach(el => {
    el.addEventListener("click", () => navigate("/tech/" + el.getAttribute("data-tech")));
  });
  root.querySelectorAll(".grid-cell:not(.empty)").forEach(el => {
    const parts = el.getAttribute("data-cell").split("/");
    const go = () => navigate("/cell/" + parts[0] + "/" + parts[1]);
    el.addEventListener("click", go);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
  root.querySelectorAll(".case-card").forEach(el => {
    const go = () => navigate("/case/" + el.getAttribute("data-case"));
    el.addEventListener("click", go);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
  root.querySelectorAll(".prio-dot").forEach(el => {
    el.addEventListener("click", () => navigate("/case/" + el.getAttribute("data-case")));
  });
  const search = root.querySelector("#f-search");
  if (search) search.addEventListener("input", e => { state.filters.search = e.target.value; render(); });
  const driver = root.querySelector("#f-driver");
  if (driver) driver.addEventListener("change", e => { state.filters.driver = e.target.value; render(); });
  const autonomy = root.querySelector("#f-autonomy");
  if (autonomy) autonomy.addEventListener("change", e => { state.filters.autonomy = e.target.value; render(); });
  const maturity = root.querySelector("#f-maturity");
  if (maturity) maturity.addEventListener("change", e => { state.filters.maturity = e.target.value; render(); });
  const robotics = root.querySelector("#f-robotics");
  if (robotics) robotics.addEventListener("click", () => { state.filters.robotics = !state.filters.robotics; render(); });
  const btnShortlist = root.querySelector("#btn-shortlist");
  if (btnShortlist) {
    btnShortlist.addEventListener("click", () => {
      const route = parseRoute();
      const idx = state.shortlist.indexOf(route.id);
      if (idx >= 0) state.shortlist.splice(idx, 1);
      else state.shortlist.push(route.id);
      saveShortlist();
      render();
    });
  }
  const btnExport = root.querySelector("#btn-export");
  if (btnExport) btnExport.addEventListener("click", () => {
    const data = state.shortlist.map(id => DATA.useCases.find(c => c.id === id)).filter(Boolean);
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ai-manufacturing-shortlist.json";
    a.click();
    URL.revokeObjectURL(a.href);
  });
  const btnClear = root.querySelector("#btn-clear");
  if (btnClear) btnClear.addEventListener("click", () => { state.shortlist = []; saveShortlist(); render(); });
  root.querySelectorAll("[data-remove]").forEach(el => {
    el.addEventListener("click", () => {
      state.shortlist = state.shortlist.filter(id => id !== el.getAttribute("data-remove"));
      saveShortlist();
      render();
    });
  });
}

document.addEventListener("keydown", e => {
  const route = parseRoute();
  if (route.view === "entry") return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;

  let stageIdx = DATA.stages.indexOf(route.stage);
  let techIdx = DATA.tech.indexOf(route.tech);
  if (route.view === "landscape" && stageIdx < 0) stageIdx = 0;
  if (route.view === "landscape" && techIdx < 0) techIdx = 0;

  if (e.key === "ArrowLeft" && stageIdx > 0) {
    e.preventDefault();
    navigate("/stage/" + DATA.stages[stageIdx - 1]);
  }
  if (e.key === "ArrowRight" && stageIdx >= 0 && stageIdx < DATA.stages.length - 1) {
    e.preventDefault();
    navigate("/stage/" + DATA.stages[stageIdx + 1]);
  }
  if (e.key === "ArrowUp" && techIdx > 0) {
    e.preventDefault();
    navigate("/tech/" + DATA.tech[techIdx - 1]);
  }
  if (e.key === "ArrowDown" && techIdx >= 0 && techIdx < DATA.tech.length - 1) {
    e.preventDefault();
    navigate("/tech/" + DATA.tech[techIdx + 1]);
  }
});

window.addEventListener("hashchange", render);
meceAudit();
render();
</script>
